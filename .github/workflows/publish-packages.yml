name: Publish Packages

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read
  packages: write

jobs:
  publish-npm:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js for npmjs
        uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@vankyle'

      # Trusted publishing requires npm CLI >= 11.5.1
      - name: Update npm
        run: npm install -g npm@^11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Trusted publishing: npm detects the OIDC token automatically — no NPM_TOKEN needed.
      # Each package must have this workflow configured as a trusted publisher on npmjs.com.
      - name: Publish packages to npmjs.com
        run: node scripts/publish-npmjs.mjs


  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@vankyle-hub'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish packages to GitHub Packages
        run: node scripts/publish-github.mjs
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
